<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Seba Exchange Mese</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --hh:4.6vh; --gap:1.2vw; --f-body:'Oswald','Arial Narrow',Arial,sans-serif; --f-num:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif; }
html,body { width:100%; height:100%; overflow:hidden; background:#9dbff4; color:#f8fafc; font-family:var(--f-body); -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
.shell { background:linear-gradient(180deg,#b0cdf8 0%,#8db6f0 100%); width:100vw; height:100vh; height:100dvh; display:grid; grid-template-rows:11vh auto 1fr; gap:0.5vh; padding:0.6vh 0.8vw; padding-top:calc(0.6vh + env(safe-area-inset-top,0px)); padding-bottom:calc(0.6vh + env(safe-area-inset-bottom,0px)); }

/* ---------- HEADER ---------- */
.header { background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%); border:1px solid #334155; border-radius:14px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 3vw; gap:1.5vw; box-shadow:0 8px 25px rgba(0,0,0,0.4); }
.brand-top { font-family:var(--f-num); font-size:5.8vh; font-weight:900; letter-spacing:0.22em; line-height:1; }
.brand-top .grn { color:#22c55e; } .brand-top .gold { color:#eab308; }
.brand-sub { font-size:4.2vh; letter-spacing:0.25em; color:#94a3b8; font-weight:600; line-height:1; margin-top:0.2vh; }
.weather-row { display:flex; align-items:center; gap:0.8vw; justify-content:center; }
.w-icon { width:7vh; height:7vh; animation:wPulse 3s ease-in-out infinite; }
.w-icon svg { width:100%; height:100%; }
#wTemp { font-size:5.5vh; font-weight:700; color:#f8fafc; line-height:1; }
.clock-wrap { text-align:right; position:relative; }
.clock-time { font-family:var(--f-num); font-size:8vh; letter-spacing:0.08em; line-height:1; color:#f8fafc; cursor:pointer; }
.clock-s { font-size:5vh; color:#64748b; }
.offline { display:none; position:absolute; right:0; bottom:-1.4vh; font-size:1.5vh; font-weight:700; letter-spacing:0.2em; color:#f59e0b; }
.offline.show { display:block; }
@keyframes wPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* ---------- ANTET COLOANE (aceeasi structura ca la randuri => aliniat) ---------- */
.cols, .row { display:grid; grid-template-columns:5.7fr 0.9fr; gap:var(--gap); }
.hgroup, .cap { display:grid; grid-template-columns:1fr 2.35fr 2.35fr; gap:var(--gap); padding-right:var(--gap); border:1px solid transparent; }
.hlab { display:flex; align-items:center; padding-left:1.5vw; font-size:3.6vh; color:#0f1e4a; font-weight:900; letter-spacing:0.14em; }
.hcell { height:var(--hh); overflow:hidden; border-radius:10px; font-size:3.6vh; font-weight:900; letter-spacing:0.14em; text-transform:uppercase; text-align:center; }
.hcell.buy { background:#10261f; border:1px solid rgba(74,222,128,0.35); color:#ffffff; }
.hcell.sell { background:#2a1518; border:1px solid rgba(248,113,113,0.35); color:#ffffff; }
.hcell.card { background:linear-gradient(180deg,#b8860b 0%,#6e4d00 100%); border:1px solid #d4a72c; color:#fff8e1; }
.hcell.card .hitem { font-size:2.8vh; letter-spacing:0.02em; }
.hcell.card .hitem.pos { font-family:var(--f-num); font-size:3.9vh; letter-spacing:0.08em; }
.htrack { display:flex; flex-direction:column; animation:boardLoop 9s ease-in-out infinite; }
.hitem { height:var(--hh); display:flex; align-items:center; justify-content:center; white-space:nowrap; gap:0.6vw; }
.hitem svg { width:3.4vh; height:3.4vh; flex-shrink:0; }
/* valori fixe (nu calc/var) - mai sigure pe TV-uri vechi; --hh = 4.6vh si nu se schimba */
@keyframes boardLoop {
  0%,55.56% { transform:translateY(0); }
  66.67%,88.89% { transform:translateY(-4.6vh); }
  100% { transform:translateY(-9.2vh); }
}

/* ---------- RANDURI ---------- */
.list { display:grid; grid-template-rows:repeat(10,1fr); gap:0.4vh; min-height:0; }
.row { min-height:0; }
.cap { background:#172554; border-color:rgba(59,130,246,0.4); border-radius:12px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.3); min-height:0; }
.cur-info { display:flex; align-items:center; gap:0.5vw; padding-left:1.2vw; min-width:0; }
.flag-box { position:relative; width:9.2vh; height:6.1vh; flex-shrink:0; overflow:hidden; border-radius:6px; border:1px solid rgba(255,255,255,0.18); box-shadow:0 3px 8px rgba(0,0,0,0.4); background:#0f172a; }
.flag-box svg, .af svg { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
.cur-txt { display:flex; flex-direction:column; justify-content:center; min-width:0; }
.cur-code { display:none; font-family:var(--f-num); font-size:5.6vw; letter-spacing:0.06em; color:#fff; line-height:1; }
.cur-name { font-size:2.9vh; color:#ffffff; font-weight:700; text-transform:uppercase; letter-spacing:0.01em; line-height:1.05; }

.nb { display:flex; align-items:center; justify-content:center; margin:0.1vh 0; border-radius:10px; background:rgba(15,23,42,0.45); border:1px solid rgba(255,255,255,0.1); font-family:var(--f-num); font-size:7vh; font-weight:bold; letter-spacing:0.24em; line-height:1; white-space:nowrap; overflow:hidden; min-width:0; }
.nb.buy, .nb.sell { color:#ffffff; }
.cardbox { display:flex; align-items:center; justify-content:center; border-radius:12px; background:linear-gradient(180deg,#b8860b 0%,#6e4d00 100%); border:1px solid #d4a72c; box-shadow:0 4px 15px rgba(0,0,0,0.3); font-family:var(--f-num); font-size:7vh; font-weight:bold; letter-spacing:0.03em; line-height:1; white-space:nowrap; overflow:hidden; min-width:0; color:#fff8e1; text-shadow:0 2px 4px rgba(0,0,0,0.45); }
.nb.buy.up { animation:gBuy 0.7s ease-in-out; } .nb.sell.up { animation:gSell 0.7s ease-in-out; } .cardbox.up { animation:gCard 0.7s ease-in-out; }
@keyframes gBuy { 50% { box-shadow:0 0 18px rgba(74,222,128,0.6); transform:scale(1.04); } }
@keyframes gSell { 50% { box-shadow:0 0 18px rgba(248,113,113,0.6); transform:scale(1.04); } }
@keyframes gCard { 50% { box-shadow:0 0 20px rgba(212,167,44,0.8); transform:scale(1.04); } }

/* ---------- ADMIN ---------- */
.admin-btn { position:fixed; bottom:1.8vh; right:1.8vw; z-index:500; width:3.8vh; height:3.8vh; border-radius:50%; background:transparent; border:1px solid rgba(234,179,8,0.08); color:rgba(234,179,8,0.1); font-family:var(--f-num); font-size:2vh; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.overlay { display:none; position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(11,19,41,0.97); z-index:2000; align-items:center; justify-content:center; }
.overlay.show { display:flex; }
.pin-box { background:#1e293b; border:2px solid #334155; border-radius:24px; padding:4vh 3vw; text-align:center; width:26vw; box-shadow:0 15px 40px rgba(0,0,0,0.5); }
.pin-title { font-family:var(--f-num); font-size:3.5vh; letter-spacing:0.2em; color:#eab308; margin-bottom:0.5vh; }
.pin-sub { font-size:1.4vh; color:#94a3b8; letter-spacing:0.15em; margin-bottom:3vh; }
.pin-dots { display:flex; justify-content:center; gap:1.5vw; margin-bottom:3vh; }
.pin-dot { width:1.8vw; height:1.8vw; border-radius:50%; border:2px solid #475569; transition:all 0.2s; }
.pin-dot.on { background:#eab308; border-color:#eab308; box-shadow:0 0 1.5vw rgba(234,179,8,0.4); }
.pin-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:0.8vw; }
.pin-key { padding:1.8vh 0; background:#0f172a; border:1px solid #334155; border-radius:12px; color:#f8fafc; font-family:var(--f-num); font-size:3.5vh; cursor:pointer; user-select:none; }
.pin-key:active { transform:scale(0.94); }
.pin-key.sm { font-family:var(--f-body); font-size:1.4vh; color:#94a3b8; font-weight:600; }
.pin-err { font-size:1.4vh; color:#ef4444; margin-top:1.5vh; min-height:1.8vh; font-weight:bold; }
.admin-box { background:#1e293b; border:2px solid #334155; border-radius:24px; padding:3vh 2.5vw; width:52vw; max-height:90vh; overflow-y:auto; box-shadow:0 15px 50px rgba(0,0,0,0.5); }
.adm-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:2vh; border-bottom:2px solid #334155; padding-bottom:1.5vh; }
.adm-title { font-family:var(--f-num); font-size:3.2vh; color:#eab308; }
.adm-close { background:#0f172a; border:1px solid #475569; color:#f8fafc; width:4vh; height:4vh; border-radius:50%; cursor:pointer; font-size:1.6vh; }
.adm-cols, .adm-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:0.8vw; }
.adm-cols { margin-bottom:1vh; text-align:center; font-size:1.4vh; font-weight:bold; color:#94a3b8; letter-spacing:0.2em; text-transform:uppercase; }
.adm-cols div:first-child { text-align:left; }
.adm-row { align-items:center; margin-bottom:0.8vh; padding:1vh 1vw; background:#0f172a; border-radius:12px; border:1px solid #334155; }
.adm-row.bad { border-color:#f87171; box-shadow:0 0 0 2px rgba(248,113,113,0.5); }
.adm-card-preview { text-align:center; font-size:2.2vh; font-weight:bold; color:#d4a72c; }
.adm-cur { display:flex; align-items:center; gap:0.8vh; font-size:1.8vh; font-weight:700; color:#f8fafc; }
.af { display:inline-block; position:relative; width:4vh; height:2.5vh; overflow:hidden; border-radius:3px; flex-shrink:0; }
.adm-input { background:#1e293b; border:2px solid #475569; border-radius:8px; font-family:var(--f-body); font-size:2.2vh; font-weight:bold; color:#f8fafc; padding:0.8vh; text-align:center; width:100%; }
.adm-input:focus { border-color:#eab308; outline:none; }
.adm-save { width:100%; margin-top:2vh; padding:1.4vh 0; background:#eab308; border:none; border-radius:12px; color:#0f172a; font-family:var(--f-num); font-size:2.6vh; font-weight:bold; letter-spacing:0.15em; cursor:pointer; }
.adm-save:disabled { opacity:0.4; }
.adm-msg { text-align:center; font-size:1.4vh; margin-top:1vh; min-height:1.5vh; font-weight:bold; }
.adm-msg.ok { color:#4ade80; } .adm-msg.err { color:#f87171; }

/* ===== PORTRAIT: telefoane, tablete, LG vertical (aspectul original, dimensiuni in vw) ===== */
@media (max-aspect-ratio: 1/1) {
  .shell { grid-template-rows:9vh auto 1fr; gap:0.9vh; padding:1.2vh 1.5vw; padding-top:calc(1.2vh + env(safe-area-inset-top,0px)); padding-bottom:calc(1.2vh + env(safe-area-inset-bottom,0px)); }
  .header { padding:0 2.5vw; gap:0; }
  .brand-top { font-size:5vw; letter-spacing:0.14em; }
  .brand-sub { font-size:2.6vw; margin-top:0.4vh; }
  .weather-row { gap:1.5vw; }
  .w-icon { width:7.5vw; height:7.5vw; }
  #wTemp { font-size:6vw; }
  .clock-time { font-size:7.6vw; letter-spacing:0.05em; }
  .clock-s { font-size:4.2vw; }
  .offline { font-size:2vw; bottom:-0.5vh; }

  .cols, .row { grid-template-columns:3.7fr 1fr; }
  .hgroup, .cap { grid-template-columns:1.55fr 1fr 1fr; }
  .hlab { font-size:2.4vw; font-weight:700; letter-spacing:0.12em; }
  .hcell { font-size:2.6vw; letter-spacing:0.08em; }
  .hcell.card .hitem { font-size:2.6vw; letter-spacing:0.08em; }
  .hcell.card .hitem.pos { font-size:2.6vw; letter-spacing:0.08em; font-family:var(--f-body); }
  .hitem svg { width:3.2vw; height:3.2vw; }

  .list { gap:0.8vh; }
  .cur-info { align-items:stretch; gap:1.4vw; padding-left:0; }
  .flag-box { width:13vw; height:auto; align-self:stretch; border-radius:0; border:none; box-shadow:none; }
  .cur-code { display:block; }
  .cur-name { font-size:1.75vw; font-weight:600; letter-spacing:0.03em; line-height:1.1; }
  .lb { display:none; }
  .nb { margin:1.1vh 0; font-size:7.2vw; letter-spacing:0.04em; }
  .cardbox { font-size:7.2vw; letter-spacing:0.04em; }

  .admin-btn { width:9vw; height:9vw; font-size:4vw; bottom:1vw; right:1vw; }
  .pin-box { width:88vw; padding:5vw 4vw; border-radius:5vw; }
  .pin-title { font-size:7vw; }
  .pin-sub { font-size:2.8vw; margin-bottom:4vw; }
  .pin-dots { gap:4vw; margin-bottom:4vw; }
  .pin-dot { width:4.5vw; height:4.5vw; }
  .pin-keypad { gap:2vw; }
  .pin-key { padding:3.4vw 0; font-size:8vw; border-radius:2.5vw; }
  .pin-key.sm { font-size:3.2vw; }
  .pin-err { font-size:3vw; min-height:4vw; margin-top:3vw; }
  .admin-box { width:96vw; max-height:94vh; max-height:94dvh; padding:3vw; border-radius:4vw; }
  .admin-box span[style] { font-size:3vw !important; }
  .adm-head { margin-bottom:2vw; padding-bottom:2vw; }
  .adm-title { font-size:5.4vw; }
  .adm-close { width:8vw; height:8vw; font-size:3.4vw; }
  .adm-cols, .adm-row { grid-template-columns:1.2fr 1fr 1fr 1fr; gap:1.5vw; }
  .adm-cols { font-size:2.4vw; letter-spacing:0.08em; }
  .adm-row { padding:1.5vw; margin-bottom:1.2vw; border-radius:2.5vw; }
  .adm-cur { font-size:3.2vw; gap:1vw; }
  .adm-nm { display:none; }
  .af { width:6vw; height:4vw; }
  .adm-input { font-size:3.8vw; padding:1.4vw 0.5vw; border-width:1.5px; border-radius:2vw; }
  .adm-card-preview { font-size:3.4vw; }
  #admCardPct { width:26vw !important; }
  .adm-save { font-size:5.4vw; padding:2.4vw 0; margin-top:3vw; border-radius:3vw; }
  .adm-msg { font-size:3vw; min-height:4vw; }
}

/* ===== LIQUID GLASS (fara backdrop-filter: aspect identic, mult mai usor pentru TV) ===== */
.shell { background:
  radial-gradient(circle at 12% 18%, rgba(255,255,255,0.85) 0, rgba(255,255,255,0) 32%),
  radial-gradient(circle at 88% 30%, rgba(125,211,252,0.9) 0, rgba(125,211,252,0) 38%),
  radial-gradient(circle at 30% 85%, rgba(165,180,252,0.9) 0, rgba(165,180,252,0) 40%),
  radial-gradient(circle at 80% 95%, rgba(255,255,255,0.7) 0, rgba(255,255,255,0) 30%),
  linear-gradient(180deg,#b0cdf8 0%,#8db6f0 100%); }
.header { background:linear-gradient(135deg,rgba(30,41,59,0.62),rgba(15,23,42,0.5)); border:1px solid rgba(255,255,255,0.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1px 0 rgba(255,255,255,0.1), 0 10px 28px rgba(15,30,80,0.3); }
.cap { position:relative; background:linear-gradient(135deg,rgba(11,22,62,0.9) 0%,rgba(14,28,76,0.82) 100%); border-color:rgba(255,255,255,0.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -1px 0 rgba(255,255,255,0.14), inset 0 0 22px rgba(255,255,255,0.06), 0 8px 22px rgba(15,30,80,0.3); }
.cap::before { content:""; position:absolute; left:0; right:0; top:0; height:48%; border-radius:12px 12px 0 0; z-index:0; pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0.16) 0%,rgba(255,255,255,0.02) 100%); }
.cap > * { position:relative; z-index:1; }
.nb { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); box-shadow:inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -2px 6px rgba(0,0,0,0.12); }
.cardbox { background:linear-gradient(180deg,rgba(255,206,96,0.78) 0%,rgba(150,100,12,0.74) 100%); border:1px solid rgba(255,255,255,0.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.65), inset 0 -2px 8px rgba(0,0,0,0.18), 0 8px 22px rgba(15,30,80,0.3); }
.hcell.buy { background:rgba(16,38,31,0.6); border-color:rgba(255,255,255,0.3); box-shadow:inset 0 1px 0 rgba(255,255,255,0.35); }
.hcell.sell { background:rgba(42,21,24,0.6); border-color:rgba(255,255,255,0.3); box-shadow:inset 0 1px 0 rgba(255,255,255,0.35); }
.hcell.card { background:linear-gradient(180deg,rgba(255,206,96,0.78) 0%,rgba(150,100,12,0.74) 100%); border-color:rgba(255,255,255,0.5); box-shadow:inset 0 1px 0 rgba(255,255,255,0.6); }

/* ===== UN SINGUR CARD: steag + nume + cumparam + vindem; al doilea card: Card ===== */
.nb { background:none; border:none; box-shadow:none; overflow:visible; }
@keyframes gBuy { 50% { text-shadow:0 0 18px rgba(255,255,255,0.9); transform:scale(1.04); } }
@keyframes gSell { 50% { text-shadow:0 0 18px rgba(255,255,255,0.9); transform:scale(1.04); } }

/* ===== STEAG IN COLTUL CARDULUI: inalt cat cardul, margine ondulata, pliuri de panza ===== */
.flag-box { position:absolute; top:0; bottom:0; left:0; width:9.4vh; height:auto; border:none; border-radius:0; box-shadow:none; background:#0f172a;
  -webkit-mask-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cpath d='M0 0H90C98 14 82 30 90 46C98 62 82 78 90 100H0Z'/%3E%3C/svg%3E");
  mask-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cpath d='M0 0H90C98 14 82 30 90 46C98 62 82 78 90 100H0Z'/%3E%3C/svg%3E");
  -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  transform-origin:0 50%; animation:flutter 5s ease-in-out infinite; }
.flag-box::after { content:""; position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0.28) 0%,rgba(0,0,0,0.2) 22%,rgba(255,255,255,0.22) 45%,rgba(0,0,0,0.22) 70%,rgba(255,255,255,0.14) 88%,rgba(0,0,0,0.26) 100%); }
.cur-info { padding-left:calc(9.4vh + 1.2vw); }
@keyframes flutter { 0%,100% { transform:skewY(0deg); } 50% { transform:skewY(-1.5deg); } }
@media (max-aspect-ratio: 1/1) {
  .flag-box { width:13vw; }
  .cur-info { padding-left:calc(13vw + 1.4vw); }
}

/* ===== CIFRE: mai mult spatiu intre cifre + intre Cumparam/Vindem; Cumparam/Vindem mai mari decat Card ===== */
.hgroup, .cap { gap:2vw; }
.nb { font-size:7.4vh; letter-spacing:0.32em; }
.cardbox { font-size:6.4vh; letter-spacing:0.03em; }
@media (max-aspect-ratio: 1/1) {
  .nb { font-size:7.2vw; letter-spacing:0.1em; }
  .cardbox { font-size:6.2vw; letter-spacing:0.04em; }
}

/* ===== TITLU MESE premium: verde mentă + auriu șampanie (degrade fin), MESE alb elegant ===== */
.brand-top .grn  { color:#a7f3d0; text-shadow:0 1px 2px rgba(0,0,0,0.35); }
.brand-top .gold { color:#fde68a; text-shadow:0 1px 2px rgba(0,0,0,0.35); }
.brand-sub { color:#ffffff; font-weight:500; letter-spacing:0.5em; text-shadow:0 1px 2px rgba(0,0,0,0.35); }
@supports ((-webkit-background-clip:text) or (background-clip:text)) {
  .brand-top .grn, .brand-top .gold { display:inline-block; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35)); }
  .brand-top .grn  { background-image:linear-gradient(180deg,#ecfdf5 0%,#a7f3d0 48%,#5fd9a0 100%); }
  .brand-top .gold { background-image:linear-gradient(180deg,#fffbe6 0%,#fde68a 45%,#d9a93a 100%); }
}
.brand-top { letter-spacing:0.28em; }
.brand-top { font-size:6.2vh; }
@media (max-aspect-ratio: 1/1) { .brand-top { font-size:5.4vw; } }

/* ===== FUNDAL din jurul rândurilor: albastru mai spre alb ===== */
.shell { background:
  radial-gradient(circle at 12% 18%, rgba(255,255,255,0.95) 0, rgba(255,255,255,0) 36%),
  radial-gradient(circle at 88% 30%, rgba(186,230,253,0.7) 0, rgba(186,230,253,0) 38%),
  radial-gradient(circle at 30% 85%, rgba(199,210,254,0.65) 0, rgba(199,210,254,0) 40%),
  radial-gradient(circle at 80% 95%, rgba(255,255,255,0.85) 0, rgba(255,255,255,0) 34%),
  linear-gradient(180deg,#e3eefc 0%,#c9defa 100%); }
@media (max-aspect-ratio: 1/1) { .brand-top { letter-spacing:0.16em; } .brand-sub { letter-spacing:0.4em; } }
</style>
</head>
<body>

<div class="overlay" id="pinOv">
  <div class="pin-box">
    <div class="pin-title">Acces Admin</div>
    <div class="pin-sub">Introduceti codul de acces</div>
    <div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
    <div class="pin-keypad">
      <div class="pin-key" onclick="pk('1')">1</div><div class="pin-key" onclick="pk('2')">2</div><div class="pin-key" onclick="pk('3')">3</div>
      <div class="pin-key" onclick="pk('4')">4</div><div class="pin-key" onclick="pk('5')">5</div><div class="pin-key" onclick="pk('6')">6</div>
      <div class="pin-key" onclick="pk('7')">7</div><div class="pin-key" onclick="pk('8')">8</div><div class="pin-key" onclick="pk('9')">9</div>
      <div class="pin-key sm" onclick="pkDel()">Sterge</div><div class="pin-key" onclick="pk('0')">0</div><div class="pin-key sm" onclick="pinClose()">Iesi</div>
    </div>
    <div class="pin-err" id="pinErr"></div>
  </div>
</div>

<div class="overlay" id="adminOv">
  <div class="admin-box">
    <div class="adm-head">
      <div class="adm-title">Editeaza Cursuri (Mese)</div>
      <button class="adm-close" onclick="adminClose()">X</button>
    </div>
    <div class="adm-cols"><div>Valuta</div><div>Cumparam</div><div>Vindem</div><div>Card</div></div>
    <div id="adminRows"></div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:1vw; margin:1.5vh 0; padding-top:1.5vh; border-top:2px solid #334155;">
      <span style="font-size:1.8vh; font-weight:700; color:#f8fafc;">Procent Card (peste curs Vindem, %)</span>
      <input class="adm-input" type="number" step="0.01" id="admCardPct" style="width:16vw;" value="1.45" oninput="admUpdateAll()">
    </div>
    <button class="adm-save" id="admSaveBtn" onclick="adminSave()">Salveaza Cursurile</button>
    <div class="adm-msg" id="admMsg"></div>
  </div>
</div>

<div class="shell">
  <header class="header">
    <div>
      <div class="brand-top"><span class="grn">SEBA </span><span class="gold">EXCHANGE</span></div>
      <div class="brand-sub">MESE</div>
    </div>
    <div class="weather-row"><div id="wIcon" class="w-icon"></div><strong id="wTemp">--&deg;C</strong></div>
    <div class="clock-wrap" onclick="clockTap()"><div class="clock-time"><span id="cHM">--:--</span><span class="clock-s" id="cS">:00</span></div><div class="offline" id="offl">OFFLINE</div></div>
  </header>

  <div class="cols">
    <div class="hgroup">
      <div class="hlab">VALUTA</div>
      <div class="hcell buy"><div class="htrack"><div class="hitem">Cumparam</div><div class="hitem">We Buy</div><div class="hitem">Cumparam</div></div></div>
      <div class="hcell sell"><div class="htrack"><div class="hitem">Vindem</div><div class="hitem">We Sell</div><div class="hitem">Vindem</div></div></div>
    </div>
    <div class="hcell card"><div class="htrack">
      <div class="hitem">VANZARE CARD</div>
      <div class="hitem pos"><svg viewBox="0 0 24 24" fill="none" stroke="#fff8e1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/></svg>POS</div>
      <div class="hitem">VANZARE CARD</div>
    </div></div>
  </div>

  <div class="list" id="list"></div>
</div>

<button class="admin-btn" onclick="pinOpen()">M</button>

<script>
var PIN = "1234"; /* SCHIMBA-L! */
var FB_URL = "https://seba-mese-default-rtdb.europe-west1.firebasedatabase.app/sebaMese/rates";
var CARD_MARKUP = 1.0145;
var LS_KEY = "sebaMeseRates";

var CURRENCIES = [
  {code:"EUR", name:"EURO"},
  {code:"USD", name:"DOLAR<br class='lb'>AMERICAN"},
  {code:"GBP", name:"LIRA<br class='lb'>STERLINA"},
  {code:"CHF", name:"FRANC<br class='lb'>ELVETIAN"},
  {code:"CAD", name:"DOLAR<br class='lb'>CANADIAN"},
  {code:"AUD", name:"DOLAR<br class='lb'>AUSTRALIAN"},
  {code:"PLN", name:"ZLOT<br class='lb'>POLONEZ"},
  {code:"TRY", name:"LIRA<br class='lb'>TURCEASCA"},
  {code:"HUF", name:"FORINT<br class='lb'>MAGHIAR"},
  {code:"AED", name:"DIRHAM<br class='lb'>EMIRATE"}
];
function plainName(n) { return n.replace(/<br[^>]*>/g, " "); }

/* Fara cursuri hardcodate: ultimele cursuri bune din localStorage, altfel "--" */
var rates = {};
(function () {
  try {
    var s = localStorage.getItem(LS_KEY);
    if (s) {
      var d = JSON.parse(s);
      if (d && d.rates) { rates = d.rates; if (typeof d.pct === "number") CARD_MARKUP = 1 + d.pct / 100; }
    }
  } catch (e) {}
})();
function cacheRates() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ rates: rates, pct: (CARD_MARKUP - 1) * 100 })); } catch (e) {}
}
function setOffline(on) { document.getElementById("offl").classList.toggle("show", !!on); }
function mergeRates(d) {
  var out = {};
  for (var i = 0; i < CURRENCIES.length; i++) {
    var k = CURRENCIES[i].code;
    out[k] = (d && d[k] && typeof d[k] === "object") ? d[k] : (rates[k] || {});
  }
  return out;
}

/* ---- STEAGURI INCORPORATE (SVG, fara internet) ---- */
function star(cx, cy, R, r, rot, fill) {
  var p = [], i, a, q;
  for (i = 0; i < 10; i++) { a = rot + i * Math.PI / 5; q = i % 2 ? r : R; p.push((cx + q * Math.sin(a)).toFixed(2) + "," + (cy - q * Math.cos(a)).toFixed(2)); }
  return '<polygon points="' + p.join(" ") + '" fill="' + fill + '"/>';
}
function gbBody() {
  return '<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.6"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6.5"/><path d="M15 0V20M0 10H30" stroke="#c8102e" stroke-width="4"/>';
}
var FL = {};
(function () {
  var k, r, c, s;
  s = '<rect width="30" height="20" fill="#039"/>';
  for (k = 0; k < 12; k++) s += '<circle cx="' + (15 + 6 * Math.sin(k * Math.PI / 6)).toFixed(2) + '" cy="' + (10 - 6 * Math.cos(k * Math.PI / 6)).toFixed(2) + '" r=".9" fill="#fc0"/>';
  FL.EUR = [s, "xMidYMid slice"];
  s = '<rect width="30" height="20" fill="#fff"/>';
  for (k = 0; k < 13; k += 2) s += '<rect y="' + (k * 20 / 13).toFixed(2) + '" width="30" height="' + (20 / 13).toFixed(2) + '" fill="#b22234"/>';
  s += '<rect width="12" height="10.77" fill="#3c3b6e"/>';
  for (r = 0; r < 4; r++) for (c = 0; c < 5; c++) s += '<circle cx="' + (1.4 + c * 2.3) + '" cy="' + (1.5 + r * 2.4) + '" r=".55" fill="#fff"/>';
  FL.USD = [s, "xMinYMid slice"];
  FL.GBP = [gbBody(), "xMidYMid slice"];
  FL.CHF = ['<rect width="30" height="20" fill="#d52b1e"/><rect x="13" y="4.5" width="4" height="11" fill="#fff"/><rect x="9.5" y="8" width="11" height="4" fill="#fff"/>', "xMidYMid slice"];
  FL.CAD = ['<rect width="30" height="20" fill="#fff"/><rect width="7.5" height="20" fill="#d52b1e"/><rect x="22.5" width="7.5" height="20" fill="#d52b1e"/><polygon fill="#d52b1e" points="15,3.5 16.3,6.5 18.8,5.7 18,9 20.5,8.7 19,11 20,12 15.8,12.6 15.8,16.5 14.2,16.5 14.2,12.6 10,12 11,11 9.5,8.7 12,9 11.2,5.7 13.7,6.5"/>', "xMidYMid slice"];
  s = '<rect width="30" height="20" fill="#00247d"/><g transform="scale(.5)">' + gbBody() + '</g>' + star(7.5, 15.5, 2, .9, 0, "#fff");
  s += star(22.5, 3.5, 1.3, .55, 0, "#fff") + star(26.5, 8, 1.3, .55, 0, "#fff") + star(19.5, 8.5, 1.3, .55, 0, "#fff") + star(22.5, 15, 1.3, .55, 0, "#fff") + star(24.2, 10.8, .8, .35, 0, "#fff");
  FL.AUD = [s, "xMidYMid slice"];
  FL.PLN = ['<rect width="30" height="10" fill="#fff"/><rect y="10" width="30" height="10" fill="#dc143c"/>', "xMidYMid slice"];
  FL.TRY = ['<rect width="30" height="20" fill="#e30a17"/><circle cx="11.2" cy="10" r="5" fill="#fff"/><circle cx="12.5" cy="10" r="4" fill="#e30a17"/>' + star(17.4, 10, 2, .8, -Math.PI / 2, "#fff"), "xMidYMid slice"];
  FL.HUF = ['<rect width="30" height="6.7" fill="#ce2939"/><rect y="6.7" width="30" height="6.7" fill="#fff"/><rect y="13.4" width="30" height="6.6" fill="#477050"/>', "xMidYMid slice"];
  FL.AED = ['<rect width="30" height="6.7" fill="#00732f"/><rect y="6.7" width="30" height="6.7" fill="#fff"/><rect y="13.4" width="30" height="6.6" fill="#000"/><rect width="7.5" height="20" fill="#f00"/>', "xMinYMid slice"];
})();
function flagSvg(code) {
  var f = FL[code];
  return '<svg viewBox="0 0 30 20" preserveAspectRatio="' + f[1] + '">' + f[0] + '</svg>';
}

function cardRate(s) { return (s === null || s === undefined || s === "") ? null : parseFloat(s) * CARD_MARKUP; }
function fmt(v) { return (v === null || v === undefined || v === "" || isNaN(parseFloat(v))) ? "--" : parseFloat(v).toFixed(4); }

function buildRows() {
  var h = "";
  for (var i = 0; i < CURRENCIES.length; i++) {
    var c = CURRENCIES[i], r = rates[c.code] || {};
    h += '<div class="row"><div class="cap"><div class="cur-info"><div class="flag-box">' + flagSvg(c.code) + '</div>' +
      '<div class="cur-txt"><div class="cur-code">' + c.code + '</div><div class="cur-name">' + c.name + '</div></div></div>' +
      '<div class="nb buy" id="b-' + c.code + '">' + fmt(r.buy) + '</div>' +
      '<div class="nb sell" id="s-' + c.code + '">' + fmt(r.sell) + '</div></div>' +
      '<div class="cardbox" id="c-' + c.code + '">' + fmt(cardRate(r.sell)) + '</div></div>';
  }
  document.getElementById("list").innerHTML = h;
}

function setVal(el, txt) {
  if (!el || el.textContent === txt) return;
  el.textContent = txt;
  el.classList.remove("up"); void el.offsetWidth; el.classList.add("up");
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove("up"); }, 800);
}
function updateVals() {
  for (var i = 0; i < CURRENCIES.length; i++) {
    var k = CURRENCIES[i].code, r = rates[k] || {};
    setVal(document.getElementById("b-" + k), fmt(r.buy));
    setVal(document.getElementById("s-" + k), fmt(r.sell));
    setVal(document.getElementById("c-" + k), fmt(cardRate(r.sell)));
  }
}

function fetchRates() {
  var x = new XMLHttpRequest();
  x.open("GET", FB_URL + ".json", true);
  x.timeout = 15000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status === 200) {
      try {
        var d = JSON.parse(x.responseText);
        if (d) {
          if (typeof d._cardPct === "number") CARD_MARKUP = 1 + d._cardPct / 100;
          rates = mergeRates(d); cacheRates(); updateVals(); setOffline(false);
          return;
        }
      } catch (e) {}
    }
    setOffline(true);
  };
  x.send();
}
function saveRates(nr, cb) {
  var x = new XMLHttpRequest();
  x.open("PUT", FB_URL + ".json", true);
  x.setRequestHeader("Content-Type", "application/json");
  x.onreadystatechange = function () { if (x.readyState === 4) cb(x.status === 200 ? null : "Eroare HTTP " + x.status); };
  x.send(JSON.stringify(nr));
}

function tick() {
  /* hour12:false = varianta compatibila cu TV-uri vechi; % 24 acopera cazul "24" de la miezul noptii */
  var p = new Intl.DateTimeFormat("en-US", {timeZone:"Europe/Bucharest", hour12:false, hour:"numeric", minute:"numeric", second:"numeric"}).formatToParts(new Date()), o = {};
  for (var i = 0; i < p.length; i++) if (p[i].type !== "literal") o[p[i].type] = p[i].value;
  var hr = parseInt(o.hour, 10) % 24;
  document.getElementById("cHM").textContent = String(hr).padStart(2, "0") + ":" + String(o.minute).padStart(2, "0");
  document.getElementById("cS").textContent = ":" + String(o.second).padStart(2, "0");
}

var SV = {
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ffb300"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#ffb300" stroke-width="2" stroke-linecap="round"/></svg>',
  cloud:'<svg viewBox="0 0 24 24"><path d="M6.5 18A3.5 3.5 0 0 1 10 14.5c.3 0 .58.04.85.11A4.5 4.5 0 0 1 19.5 13a4.5 4.5 0 0 1 .5 8.97V22H6.5a3.5 3.5 0 0 1 0-7z" fill="#b0bec5"/></svg>',
  partly:'<svg viewBox="0 0 24 24"><circle cx="15.5" cy="8.5" r="3.5" fill="#ffb300"/><path d="M6.5 18A3.5 3.5 0 0 1 10 14.5c.3 0 .58.04.85.11A4.5 4.5 0 0 1 19.5 13a4.5 4.5 0 0 1 .5 8.97V22H6.5a3.5 3.5 0 0 1 0-7z" fill="#cfd8dc"/></svg>',
  rain:'<svg viewBox="0 0 24 24"><path d="M6.5 15A3.5 3.5 0 0 1 10 11.5c.3 0 .58.04.85.11A4.5 4.5 0 0 1 19.5 10a4.5 4.5 0 0 1 .5 8.97V19H6.5a3.5 3.5 0 0 1 0-7z" fill="#90a4ae"/><path d="M9 21v2M13 21v2M17 21v2" stroke="#29b6f6" stroke-width="1.5" stroke-linecap="round"/></svg>',
  snow:'<svg viewBox="0 0 24 24"><path d="M6.5 15A3.5 3.5 0 0 1 10 11.5c.3 0 .58.04.85.11A4.5 4.5 0 0 1 19.5 10a4.5 4.5 0 0 1 .5 8.97V19H6.5a3.5 3.5 0 0 1 0-7z" fill="#90a4ae"/><circle cx="9" cy="22" r="1" fill="#e0e0e0"/><circle cx="13" cy="22" r="1" fill="#e0e0e0"/><circle cx="17" cy="22" r="1" fill="#e0e0e0"/></svg>',
  storm:'<svg viewBox="0 0 24 24"><path d="M6.5 15A3.5 3.5 0 0 1 10 11.5c.3 0 .58.04.85.11A4.5 4.5 0 0 1 19.5 10a4.5 4.5 0 0 1 .5 8.97V19H6.5a3.5 3.5 0 0 1 0-7z" fill="#78909c"/><path d="M13 18l-2 3h3l-1 3" stroke="#ffeb3b" stroke-width="1.5" fill="none"/></svg>'
};
var WC = {0:"sun",1:"partly",2:"partly",3:"cloud",45:"cloud",48:"cloud",
  51:"rain",53:"rain",55:"rain",56:"rain",57:"rain",61:"rain",63:"rain",65:"rain",66:"rain",67:"rain",
  71:"snow",73:"snow",75:"snow",77:"snow",80:"rain",81:"rain",82:"storm",85:"snow",86:"snow",95:"storm",96:"storm",99:"storm"};
function fetchWeather() {
  var x = new XMLHttpRequest();
  x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=45.0997&longitude=24.3693&current=temperature_2m,weathercode&timezone=auto", true);
  x.onreadystatechange = function () {
    if (x.readyState === 4 && x.status === 200) {
      try {
        var d = JSON.parse(x.responseText);
        document.getElementById("wIcon").innerHTML = SV[WC[d.current.weathercode] || "partly"];
        document.getElementById("wTemp").innerHTML = Math.round(d.current.temperature_2m) + "&deg;C";
      } catch (e) {}
    }
  };
  x.send();
}

var buf = "";
function dots() { for (var i = 0; i < 4; i++) document.getElementById("pd" + i).classList.toggle("on", i < buf.length); }
window.pk = function (d) {
  if (buf.length >= 4) return;
  buf += d; dots();
  if (buf.length === 4) setTimeout(function () {
    if (buf === PIN) { pinClose(); adminOpen(); }
    else { document.getElementById("pinErr").textContent = "Cod incorect."; setTimeout(function () { buf = ""; dots(); document.getElementById("pinErr").textContent = ""; }, 900); }
    buf = "";
  }, 150);
};
window.pkDel = function () { buf = buf.slice(0, -1); dots(); };
window.pinClose = function () { document.getElementById("pinOv").classList.remove("show"); buf = ""; dots(); document.getElementById("pinErr").textContent = ""; };
window.pinOpen = function () { document.getElementById("pinOv").classList.add("show"); };
var tc = 0, tt = null;
/* 3 atingeri pe ceas deschid acum tastatura PIN (inainte intrau direct in admin, fara cod) */
window.clockTap = function () { tc++; clearTimeout(tt); tt = setTimeout(function () { tc = 0; }, 1400); if (tc >= 3) { tc = 0; pinOpen(); } };
var kb = "", kt = null;
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { pinClose(); adminClose(); return; }
  if (e.key >= "0" && e.key <= "9") {
    kb += e.key; clearTimeout(kt); kt = setTimeout(function () { kb = ""; }, 4000);
    if (kb.slice(-4) === PIN) { kb = ""; pinClose(); adminOpen(); }
  }
});

function adminOpen() {
  var rows = document.getElementById("adminRows");
  rows.innerHTML = "";
  for (var i = 0; i < CURRENCIES.length; i++) {
    var cur = CURRENCIES[i], rv = rates[cur.code] || {};
    var row = document.createElement("div");
    row.className = "adm-row";
    row.id = "ar-" + cur.code;
    row.innerHTML =
      '<div class="adm-cur"><span class="af">' + flagSvg(cur.code) + '</span>' + cur.code + '<span class="adm-nm"> - ' + plainName(cur.name) + '</span></div>' +
      '<input class="adm-input" type="number" step="0.0001" id="ab-' + cur.code + '" value="' + (rv.buy || "") + '">' +
      '<input class="adm-input" type="number" step="0.0001" id="as-' + cur.code + '" oninput="admUpdateAll()" value="' + (rv.sell || "") + '">' +
      '<div class="adm-card-preview" id="ac-' + cur.code + '">' + fmt(cardRate(rv.sell)) + '</div>';
    rows.appendChild(row);
  }
  document.getElementById("admCardPct").value = ((CARD_MARKUP - 1) * 100).toFixed(2);
  document.getElementById("adminOv").classList.add("show");
}
window.admUpdateAll = function () {
  var pct = parseFloat(document.getElementById("admCardPct").value);
  if (isNaN(pct)) pct = (CARD_MARKUP - 1) * 100;
  for (var i = 0; i < CURRENCIES.length; i++) {
    var k = CURRENCIES[i].code, s = parseFloat(document.getElementById("as-" + k).value);
    document.getElementById("ac-" + k).textContent = isNaN(s) ? "--" : (s * (1 + pct / 100)).toFixed(4);
  }
};
window.adminClose = function () { document.getElementById("adminOv").classList.remove("show"); };
window.adminSave = function () {
  var btn = document.getElementById("admSaveBtn"), msg = document.getElementById("admMsg"), nr = {}, bad = [], i, k, b, s;
  for (i = 0; i < CURRENCIES.length; i++) {
    k = CURRENCIES[i].code;
    b = parseFloat(document.getElementById("ab-" + k).value);
    s = parseFloat(document.getElementById("as-" + k).value);
    document.getElementById("ar-" + k).classList.remove("bad");
    if (!isNaN(b) && !isNaN(s) && s < b) { bad.push(k); document.getElementById("ar-" + k).classList.add("bad"); }
    nr[k] = { buy: isNaN(b) ? null : b, sell: isNaN(s) ? null : s };
  }
  if (bad.length) {
    msg.textContent = "Vindem < Cumparam la: " + bad.join(", ") + ". Corecteaza."; msg.className = "adm-msg err";
    return;
  }
  var pct = parseFloat(document.getElementById("admCardPct").value);
  if (isNaN(pct)) pct = (CARD_MARKUP - 1) * 100;
  nr._cardPct = pct;
  btn.disabled = true; btn.textContent = "Se salveaza...";
  saveRates(nr, function (err) {
    if (!err) { CARD_MARKUP = 1 + pct / 100; rates = mergeRates(nr); cacheRates(); updateVals(); setOffline(false); msg.textContent = "Salvat cu succes!"; msg.className = "adm-msg ok"; }
    else { msg.textContent = "Eroare: " + err; msg.className = "adm-msg err"; }
    btn.disabled = false; btn.textContent = "Salveaza Cursurile";
    setTimeout(function () { msg.textContent = ""; msg.className = "adm-msg"; }, 4000);
  });
};

buildRows();
fetchRates(); setInterval(fetchRates, 30000);
tick(); setInterval(tick, 1000);
fetchWeather(); setInterval(fetchWeather, 600000);
</script>
</body>
</html>
